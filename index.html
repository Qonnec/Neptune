<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://avatars.githubusercontent.com; connect-src 'self' https://api.github.com; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Sign in · Autometrik Help Desk</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login-wrap">
    <form id="loginForm" class="login-card" autocomplete="on">
      <div class="brand"><span class="brand-mark" aria-hidden="true">A</span><span>Autometrik <strong>Help Desk</strong></span></div>
      <h1>Sign in</h1>
      <p class="muted">Support tickets and customer onboarding.</p>
      <p id="loginMsg" class="notice" role="alert" hidden></p>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button id="loginBtn" class="btn primary" type="submit" data-busy="Unlocking…">Sign in</button>
      <p class="login-foot">Forgot your password? Ask a help desk admin to reset it.</p>
    </form>
  </main>
  <script src="js/config.js"></script>
  <script src="js/crypto.js"></script>
  <script src="js/common.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
